apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'
def releaseKeystore = file('release/fresnica-release.keystore')
def releaseStorePassword = findProperty('FRESNICA_RELEASE_STORE_PASSWORD') ?: System.getenv('FRESNICA_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = findProperty('FRESNICA_RELEASE_KEY_ALIAS') ?: System.getenv('FRESNICA_RELEASE_KEY_ALIAS')
def releaseKeyPassword = findProperty('FRESNICA_RELEASE_KEY_PASSWORD') ?: System.getenv('FRESNICA_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseKeystore.exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fresnica.mobile"
    defaultConfig {
        applicationId "com.fresnica.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (releaseRequested && !hasReleaseSigning) {
        throw new GradleException(
            'Fresnica release signing is not configured. Place the keystore at ' +
            'android/app/release/fresnica-release.keystore and configure ' +
            'FRESNICA_RELEASE_STORE_PASSWORD, FRESNICA_RELEASE_KEY_ALIAS, and ' +
            'FRESNICA_RELEASE_KEY_PASSWORD in ~/.gradle/gradle.properties or the environment.'
        )
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    implementation files("../../vendor/fresnica/native/fresnica-native-sdk-0.2.1.aar")
    implementation files("../../vendor/fresnica/adapter/react-native/fresnica-rn-adapter.aar")
    implementation "net.java.dev.jna:jna:5.12.1@aar"
    implementation "androidx.annotation:annotation:1.8.2"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.core:core:1.12.0"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
