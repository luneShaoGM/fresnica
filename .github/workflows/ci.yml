name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Generate package lock
        run: npm install --package-lock-only
      - name: Commit generated package lock on feature PR
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/realm-persistence'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: lock Realm dependency tree'
          git push origin HEAD:${{ github.head_ref }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test
