name: CI

on:
  push:
    branches:
      - main
      - feat/fresnica-mobile-v1
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
