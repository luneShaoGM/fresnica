name: Fresnica Controller

on:
  pull_request_target:
    types:
      - synchronize
  issue_comment:
    types:
      - created
      - edited
  workflow_run:
    workflows:
      - CI
      - Realm Integration
      - Native Android Gate
      - Native Apple Gate
      - AI Handoff Gate
      - AI Review Gate
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: fresnica-controller
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted controller source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify controller contract
        run: node --test scripts/fresnica-controller.test.cjs scripts/fresnica-gate-planner.test.cjs

      - name: Reconcile Fresnica PR state
        uses: actions/github-script@v7
        with:
          script: |
            const controller = require('./scripts/fresnica-controller.cjs');
            await controller.run({ github, context, core });
