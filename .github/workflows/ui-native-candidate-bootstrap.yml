name: UI Native candidate bootstrap (one-time)

on:
  push:
    branches:
      - feat/ui-native-pinned-first-consumer-2026-10-15
    paths:
      - .github/workflows/ui-native-candidate-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize-pinned-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Fresnica consumer
        uses: actions/checkout@v4
      - name: Checkout pinned Native UI source
        uses: actions/checkout@v4
        with:
          repository: Pixman022/fresnica-ui-native
          ref: 7182872be5c1557bc332d270bf3a5e7cec48c409
          path: .ui-native-source
          persist-credentials: false
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Build and pack immutable Native UI source
        working-directory: .ui-native-source
        run: |
          npm ci
          npm run build
          npm pack --pack-destination .
      - name: Verify exact upstream candidate checksum
        run: |
          echo '54913d4c4466d3cd5744b41d878a3af54344728bda30dc3592ccef2c07fd834f  .ui-native-source/fresnica-ui-native-1.1.0-rc.1.tgz' | sha256sum -c -
          mkdir -p vendor/ui-native
          cp .ui-native-source/fresnica-ui-native-1.1.0-rc.1.tgz vendor/ui-native/
      - name: Generate npm-managed consumer dependency lock
        run: |
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund ./vendor/ui-native/fresnica-ui-native-1.1.0-rc.1.tgz
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "require.resolve('@fresnica/ui-native')"
          node -e "require.resolve('@fresnica/ui-native/locales')"
      - name: Commit only pinned package and generated manifest/lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git add -f vendor/ui-native/fresnica-ui-native-1.1.0-rc.1.tgz
          git diff --cached --check
          git diff --cached --quiet && { echo 'No candidate changes created'; exit 1; }
          git commit -m 'chore(ui): pin verified native component candidate'
          git push origin "HEAD:${GITHUB_REF_NAME}"
