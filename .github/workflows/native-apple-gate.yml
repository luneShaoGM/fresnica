name: Native Apple Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple:
    runs-on: macos-15
    steps:
      - name: Checkout Fresnica Mobile
        uses: actions/checkout@v4

      - name: Checkout Fresnica adapter source
        uses: actions/checkout@v4
        with:
          repository: manran/fresnica
          ref: 4ba1cbe8f189c74cf20e2ccbfdcf3939afa930a8
          path: .fresnica-upstream

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify TypeScript and unit tests
        run: npm run check

      - name: Download and verify Fresnica Native SDK 0.2.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fresnica/native vendor/fresnica/adapter/react-native
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/FresnicaSDK-0.2.1-apple.zip" \
            https://github.com/manran/fresnica/releases/download/native-sdk-v0.2.1/FresnicaSDK-0.2.1-apple.zip
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/SHA256SUMS" \
            https://github.com/manran/fresnica/releases/download/native-sdk-v0.2.1/SHA256SUMS
          expected="$(grep 'FresnicaSDK-0.2.1-apple.zip' "$RUNNER_TEMP/SHA256SUMS" | awk '{print $1}')"
          test "$expected" = "dccb756ca034a42df760114031ea2abf7b0e95cabebda6fe536c29f1dcd5a3d2"
          actual="$(shasum -a 256 "$RUNNER_TEMP/FresnicaSDK-0.2.1-apple.zip" | awk '{print $1}')"
          test "$actual" = "$expected"

          extract_dir="$RUNNER_TEMP/fresnica-apple-sdk"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$RUNNER_TEMP/FresnicaSDK-0.2.1-apple.zip" -d "$extract_dir"
          sdk="$(find "$extract_dir" -type d -name FresnicaSDK.xcframework -print -quit)"
          ffi="$(find "$extract_dir" -type d -name FresnicaSDKFFI.xcframework -print -quit)"
          test -n "$sdk"
          test -n "$ffi"
          rm -rf vendor/fresnica/native/FresnicaSDK.xcframework vendor/fresnica/native/FresnicaSDKFFI.xcframework
          cp -R "$sdk" vendor/fresnica/native/FresnicaSDK.xcframework
          cp -R "$ffi" vendor/fresnica/native/FresnicaSDKFFI.xcframework

      - name: Bootstrap React Native CocoaPods
        working-directory: ios
        env:
          FRESNICA_ADAPTER_BOOTSTRAP: '1'
        run: bundle exec pod install

      - name: Prepare RN 0.87 Apple module-name compatibility shim
        shell: bash
        run: |
          set -euo pipefail
          export_file="$GITHUB_WORKSPACE/.fresnica-upstream/adapters/react-native/apple/FresnicaCoreModule.m"
          original='@interface RCT_EXTERN_MODULE(FresnicaCoreModule, NSObject)'
          remapped='@interface RCT_EXTERN_REMAP_MODULE(FresnicaCore, FresnicaCoreModule, NSObject)'
          grep -F "$original" "$export_file"
          perl -0pi -e 's/\@interface RCT_EXTERN_MODULE\(FresnicaCoreModule, NSObject\)/\@interface RCT_EXTERN_REMAP_MODULE(FresnicaCore, FresnicaCoreModule, NSObject)/' "$export_file"
          grep -F "$remapped" "$export_file"

      - name: Build canonical React Native Apple adapter
        shell: bash
        run: |
          set -euo pipefail
          node .fresnica-upstream/adapters/react-native/tooling/fresnica-adapter.mjs \
            build react-native \
            --platform apple \
            --project "$GITHUB_WORKSPACE" \
            --native-apple-sdk-xcframework "$GITHUB_WORKSPACE/vendor/fresnica/native/FresnicaSDK.xcframework" \
            --native-apple-ffi-xcframework "$GITHUB_WORKSPACE/vendor/fresnica/native/FresnicaSDKFFI.xcframework" \
            --out "$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native"

      - name: Validate adapter manifest and slices
        shell: bash
        run: |
          set -euo pipefail
          node .fresnica-upstream/adapters/react-native/tooling/adapter-manifest.mjs check \
            --project "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native/adapter-manifest.json"
          bash .fresnica-upstream/adapters/react-native/apple/validate-consumer.sh \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/vendor/fresnica/native"

      - name: Link Fresnica native pod
        working-directory: ios
        run: bundle exec pod install

      - name: Build iOS simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Fresnica.xcworkspace \
            -scheme Fresnica \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/fresnica-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Apple FresnicaCore parseAccount smoke
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/fresnica-derived/Build/Products/Debug-iphonesimulator/Fresnica.app"
          test -d "$app"
          udid="$(xcrun simctl list devices available | grep -E 'iPhone .*\([0-9A-Fa-f-]{36}\)' | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')"
          test -n "$udid"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

          cp scripts/native-runtime-smoke-entry.js index.js
          FRESNICA_SMOKE_RESULT="$RUNNER_TEMP/apple-native-runtime-smoke.json" node scripts/native-runtime-smoke-server.mjs > "$RUNNER_TEMP/apple-smoke-server.log" 2>&1 &
          smoke_server_pid=$!
          npx react-native start --port 8081 > "$RUNNER_TEMP/apple-metro.log" 2>&1 &
          metro_pid=$!
          trap 'kill "$metro_pid" "$smoke_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'
          xcrun simctl install "$udid" "$app"
          xcrun simctl terminate "$udid" com.fresnica.mobile || true
          xcrun simctl launch "$udid" com.fresnica.mobile
          set +e
          wait "$smoke_server_pid"
          smoke_status=$?
          set -e
          cat "$RUNNER_TEMP/apple-native-runtime-smoke.json" || true
          if [ "$smoke_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/apple-smoke-server.log" || true
            cat "$RUNNER_TEMP/apple-metro.log" || true
            xcrun simctl spawn "$udid" log show --last 5m --style compact --predicate 'process == "Fresnica"' || true
            exit "$smoke_status"
          fi
          grep -F 'FRESNICA_PARSE_ACCOUNT_SMOKE_OK' "$RUNNER_TEMP/apple-native-runtime-smoke.json"

      - name: Upload generated Apple native artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresnica-apple-native-integration
          if-no-files-found: error
          path: |
            vendor/fresnica/native/FresnicaSDK.xcframework
            vendor/fresnica/native/FresnicaSDKFFI.xcframework
            vendor/fresnica/adapter/react-native/FresnicaRNAdapter.xcframework
            vendor/fresnica/adapter/react-native/adapter-manifest.json
            ${{ runner.temp }}/apple-native-runtime-smoke.json
