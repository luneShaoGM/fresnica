name: Native Android Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Fresnica Mobile
        uses: actions/checkout@v4

      - name: Checkout Fresnica adapter source
        uses: actions/checkout@v4
        with:
          repository: manran/fresnica
          ref: b1d0427ec5c5398c3bb2e01b886e4e3084e46a73
          path: .fresnica-upstream

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify TypeScript and unit tests
        run: npm run check

      - name: Download and verify Fresnica Native SDK 0.3.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fresnica/native vendor/fresnica/adapter/react-native
          curl --fail --location --retry 3 \
            --output vendor/fresnica/native/fresnica-native-sdk-0.3.0.aar \
            https://github.com/manran/fresnica/releases/download/native-sdk-v0.3.0/fresnica-native-sdk-0.3.0.aar
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/SHA256SUMS" \
            https://github.com/manran/fresnica/releases/download/native-sdk-v0.3.0/SHA256SUMS
          expected="$(grep 'fresnica-native-sdk-0.3.0.aar' "$RUNNER_TEMP/SHA256SUMS" | awk '{print $1}')"
          test "$expected" = "4eada0dcc5e0bd3330572b13eafbb57cfa7dcc6c0adf120992d63d35aee11c6e"
          actual="$(sha256sum vendor/fresnica/native/fresnica-native-sdk-0.3.0.aar | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Verify consumer-toolchain adapter baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./.fresnica-upstream/adapters/react-native/package.json').version")" = "0.3.0"
          grep -F "apply plugin: 'com.android.library'" .fresnica-upstream/adapters/react-native/android/build.gradle
          grep -F 'gradle-9.4.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      # Upstream issues:
      # https://github.com/Fresnica/fresnica/issues/128
      # https://github.com/Fresnica/fresnica/issues/129
      # Keep these checkout-only compatibility patches until the canonical
      # adapter ships fixes for included-build init evaluation and modern
      # consumer JVM-target alignment.
      - name: Patch pinned Fresnica adapter compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          init_path = Path('.fresnica-upstream/adapters/react-native/android/include.init.gradle')
          init_original = init_path.read_text()
          init_expected = "def adapterProjectDir = gradle.startParameter.projectProperties['fresnicaAdapterProjectDir']\n"
          if not init_original.startswith(init_expected):
              raise SystemExit('unexpected Fresnica adapter init-script baseline')
          init_path.write_text("if (gradle.parent != null) {\n    return\n}\n\n" + init_original)

          build_path = Path('.fresnica-upstream/adapters/react-native/android/build.gradle')
          build_original = build_path.read_text()
          expected_java = 'sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8'
          expected_kotlin = "task.kotlinOptions.jvmTarget = '1.8'"
          if expected_java not in build_original or expected_kotlin not in build_original:
              raise SystemExit('unexpected Fresnica adapter JVM-target baseline')
          patched = build_original.replace(
              expected_java,
              'sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17',
              1,
          ).replace(expected_kotlin, "task.kotlinOptions.jvmTarget = '17'", 1)
          build_path.write_text(patched)
          PY
          grep -F 'if (gradle.parent != null)' .fresnica-upstream/adapters/react-native/android/include.init.gradle
          grep -F 'sourceCompatibility JavaVersion.VERSION_17' .fresnica-upstream/adapters/react-native/android/build.gradle
          grep -F "task.kotlinOptions.jvmTarget = '17'" .fresnica-upstream/adapters/react-native/android/build.gradle

      - name: Build canonical React Native Android adapter
        shell: bash
        run: |
          set -euo pipefail
          node .fresnica-upstream/adapters/react-native/tooling/fresnica-adapter.mjs \
            build react-native \
            --platform android \
            --project "$GITHUB_WORKSPACE" \
            --native-android-aar "$GITHUB_WORKSPACE/vendor/fresnica/native/fresnica-native-sdk-0.3.0.aar" \
            --out "$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native"

      - name: Validate adapter manifest
        shell: bash
        run: |
          set -euo pipefail
          node .fresnica-upstream/adapters/react-native/tooling/adapter-manifest.mjs check \
            --project "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native/adapter-manifest.json"

      - name: Verify generated Android adapter contents
        shell: bash
        run: |
          set -euo pipefail
          adapter_aar="$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native/fresnica-rn-adapter.aar"
          test -f "$adapter_aar"
          unzip -p "$adapter_aar" classes.jar > "$RUNNER_TEMP/fresnica-rn-adapter-classes.jar"
          jar tf "$RUNNER_TEMP/fresnica-rn-adapter-classes.jar" | grep -F 'com/fresnica/sdk/reactnative/FresnicaCorePackage.class'

      - name: Build Android debug app for native link verification
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Verify Android release signing fails closed without credentials
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 \
            > "$RUNNER_TEMP/release-without-signing.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F \
            'Fresnica Android release signing credentials are required for release packaging; debug signing fallback is forbidden.' \
            "$RUNNER_TEMP/release-without-signing.log"

      - name: Build and verify test-signed Android release app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/fresnica-ci-release.jks"
          signing_password="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -keystore "$keystore" \
            -storetype PKCS12 \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias fresnica-ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=Fresnica CI Release Gate,O=Fresnica,C=US' \
            -noprompt
          FRESNICA_ANDROID_RELEASE_STORE_FILE="$keystore" \
          FRESNICA_ANDROID_RELEASE_STORE_PASSWORD="$signing_password" \
          FRESNICA_ANDROID_RELEASE_KEY_ALIAS=fresnica-ci-release \
          FRESNICA_ANDROID_RELEASE_KEY_PASSWORD="$signing_password" \
            ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --stacktrace

          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$cert_output" | grep -F 'CN=Fresnica CI Release Gate'
          if printf '%s\n' "$cert_output" | grep -F 'CN=Android Debug'; then
            echo 'Release APK unexpectedly uses the Android debug certificate' >&2
            exit 1
          fi

      - name: Upload generated native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresnica-android-native-integration
          if-no-files-found: error
          path: |
            vendor/fresnica/native/fresnica-native-sdk-0.3.0.aar
            vendor/fresnica/adapter/react-native/fresnica-rn-adapter.aar
            vendor/fresnica/adapter/react-native/adapter-manifest.json
            android/app/build/outputs/apk/debug/app-debug.apk
