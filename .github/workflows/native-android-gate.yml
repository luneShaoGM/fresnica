name: Native Android Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Fresnica Mobile
        uses: actions/checkout@v4

      - name: Checkout Fresnica adapter source
        uses: actions/checkout@v4
        with:
          repository: manran/fresnica
          ref: 47383bd94b1f88882dd0759f7275bd8b5452dcdb
          path: .fresnica-upstream

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify TypeScript and unit tests
        run: npm run check

      - name: Download and verify Fresnica Native SDK 0.2.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/fresnica/native vendor/fresnica/adapter/react-native
          curl --fail --location --retry 3 \
            --output vendor/fresnica/native/fresnica-native-sdk-0.2.1.aar \
            https://github.com/manran/fresnica/releases/download/native-sdk-v0.2.1/fresnica-native-sdk-0.2.1.aar
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/SHA256SUMS" \
            https://github.com/manran/fresnica/releases/download/native-sdk-v0.2.1/SHA256SUMS
          expected="$(grep 'fresnica-native-sdk-0.2.1.aar' "$RUNNER_TEMP/SHA256SUMS" | awk '{print $1}')"
          test "$expected" = "6a7a05861970608e42a50546abeb19881e5bc47b3b4b6f6e3116a04d6a41529f"
          actual="$(sha256sum vendor/fresnica/native/fresnica-native-sdk-0.2.1.aar | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Verify consumer-toolchain adapter baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./.fresnica-upstream/adapters/react-native/package.json').version")" = "0.2.1"
          grep -F "apply plugin: 'com.android.library'" .fresnica-upstream/adapters/react-native/android/build.gradle
          grep -F 'gradle-9.4.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      # Upstream issue: https://github.com/Fresnica/fresnica/issues/128
      # Gradle init scripts also run for nested/included builds. The 0.2.1
      # adapter init script currently requires root-only -P properties before
      # checking which build is being initialized, so React Native's included
      # Gradle plugin build fails before the consumer settings build completes.
      # Keep this checkout-only compatibility guard until upstream ships it.
      - name: Guard Fresnica adapter init script in included builds
        shell: bash
        run: |
          set -euo pipefail
          init_script=.fresnica-upstream/adapters/react-native/android/include.init.gradle
          grep -F "gradle.startParameter.projectProperties['fresnicaAdapterProjectDir']" "$init_script"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.fresnica-upstream/adapters/react-native/android/include.init.gradle')
          original = path.read_text()
          expected = "def adapterProjectDir = gradle.startParameter.projectProperties['fresnicaAdapterProjectDir']\n"
          if not original.startswith(expected):
              raise SystemExit('unexpected Fresnica adapter init-script baseline')
          guard = "if (gradle.parent != null) {\n    return\n}\n\n"
          path.write_text(guard + original)
          PY
          grep -F 'if (gradle.parent != null)' "$init_script"

      - name: Build canonical React Native Android adapter
        shell: bash
        run: |
          set -euo pipefail
          node .fresnica-upstream/adapters/react-native/tooling/fresnica-adapter.mjs \
            build react-native \
            --platform android \
            --project "$GITHUB_WORKSPACE" \
            --native-android-aar "$GITHUB_WORKSPACE/vendor/fresnica/native/fresnica-native-sdk-0.2.1.aar" \
            --out "$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native"

      - name: Validate adapter manifest
        shell: bash
        run: |
          set -euo pipefail
          node .fresnica-upstream/adapters/react-native/tooling/adapter-manifest.mjs check \
            --project "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native/adapter-manifest.json"

      - name: Verify generated Android adapter contents
        shell: bash
        run: |
          set -euo pipefail
          adapter_aar="$GITHUB_WORKSPACE/vendor/fresnica/adapter/react-native/fresnica-rn-adapter.aar"
          test -f "$adapter_aar"
          unzip -p "$adapter_aar" classes.jar > "$RUNNER_TEMP/fresnica-rn-adapter-classes.jar"
          jar tf "$RUNNER_TEMP/fresnica-rn-adapter-classes.jar" | grep -F 'com/fresnica/sdk/reactnative/FresnicaCorePackage.class'

      - name: Build Android debug app for native link verification
        working-directory: android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Upload generated native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fresnica-android-native-integration
          if-no-files-found: error
          path: |
            vendor/fresnica/native/fresnica-native-sdk-0.2.1.aar
            vendor/fresnica/adapter/react-native/fresnica-rn-adapter.aar
            vendor/fresnica/adapter/react-native/adapter-manifest.json
            android/app/build/outputs/apk/debug/app-debug.apk
