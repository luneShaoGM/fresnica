name: AI Review Gate

on:
  pull_request:
    types:
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out review parser
        uses: actions/checkout@v4

      - name: Verify Work review gate
        uses: actions/github-script@v7
        with:
          script: |
            const controller = require('./scripts/fresnica-controller.cjs');
            await controller.runReviewGate({ github, context, core });
